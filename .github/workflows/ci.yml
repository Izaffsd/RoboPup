name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build & smoke test
    runs-on: ubuntu-latest
    # GitHub-hosted runners have no GPU: Chrome renders with SwiftShader at a
    # few seconds per frame, and the tests wait on the game's own clock.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Smoke + device tests (headless Chrome, production build)
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node scripts/smoke-test.mjs --url=http://localhost:4173/ --channel=chrome
          node scripts/device-test.mjs --url=http://localhost:4173/ --channel=chrome
